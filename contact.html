<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Travel Planner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f5f8fc;
}

header{
    background:#0d6efd;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-size:18px;
}

nav a:hover{
    color:yellow;
}

.container{
    max-width:700px;
    margin:60px auto;
    padding:40px;
    background:white;
    border-radius:15px;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.container h1{
    text-align:center;
    color:#0d6efd;
    margin-bottom:30px;
}

.contact-info{
    font-size:18px;
    color:#555;
    line-height:2;
}

.contact-info strong{
    color:#0d6efd;
}

form{
    margin-top:30px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    height:120px;
    resize:none;
}

button{
    background:#ffc107;
    border:none;
    padding:12px 30px;
    border-radius:25px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff9800;
}

footer{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:80px;
}

</style>

</head>

<body>

<header>

<div class="logo">
🌍 Travel Planner
</div>

<nav>

<a href="plantrip.html">Plan Trip</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<a href="index.html">Logout</a>

</nav>

</header>


<div class="container">

<h1>Contact Us</h1>

<div class="contact-info">

<p>Have any questions or suggestions? Feel free to contact us.</p>

<p><strong>📧 Email:</strong> travelplanner@gmail.com</p>

<p><strong>📞 Phone:</strong> +91 98765 43210</p>

<p><strong>📍 Location:</strong> Tamil Nadu, India</p>

</div>


<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

</div>


<footer>

<h3>Travel Itinerary Planner</h3>

<p>Plan • Explore • Enjoy</p>

<p>© 2026 All Rights Reserved</p>
