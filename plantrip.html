<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Your Trip</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:60%;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#0077b6;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.checkbox-group{
    margin-top:10px;
}

.checkbox-group label{
    font-weight:normal;
}

button{
    width:100%;
    padding:15px;
    margin-top:25px;
    background:#0077b6;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#023e8a;
}

</style>

</head>

<body>

<div class="container">

<h2>Travel Itinerary Planner</h2>

<form onsubmit="generateItinerary(event)">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Mobile Number</label>
<input type="tel" id="mobile" required>

<label>Starting Location</label>

<select id="start" required>

<option value="">-- Select Starting Location --</option>

<option value="Chennai">📍 Chennai</option>

<option value="Coimbatore">📍 Coimbatore</option>

<option value="Madurai">📍 Madurai</option>

<option value="Trichy">📍 Trichy</option>

<option value="Salem">📍 Salem</option>

<option value="Erode">📍 Erode</option>

<option value="Tirunelveli">📍 Tirunelveli</option>

<option value="Vellore">📍 Vellore</option>

<option value="Bangalore">📍 Bangalore</option>

<option value="Hyderabad">📍 Hyderabad</option>

<option value="Kochi">📍 Kochi</option>

</select>

<label>Destination</label>

<select id="destination" required onchange="showImage()">

<option value="">-- Select Destination --</option>

<option value="Ooty">Ooty</option>
<option value="Kodaikanal">Kodaikanal</option>
<option value="Goa">Goa</option>
<option value="Kerala">Kerala</option>
<option value="Kanyakumari">Kanyakumari</option>
<option value="Manali">Manali</option>
<option value="Munnar">Munnar</option>
<option value="Mysore">Mysore</option>
<option value="Coorg">Coorg</option>
<option value="Chennai">Chennai</option>
<option value="Pondicherry">Pondicherry</option>
<option value="Yercaud">Yercaud</option>

</select>
<div style="text-align:center; margin-top:20px;">

<h3>Destination Preview</h3>

<img id="destinationImage"
src=""
width="400"
height="250"
style="border-radius:10px; display:none; box-shadow:0px 5px 10px gray;">

</div>

<label>Departure Date</label>
<input type="date" id="departure" required>

<label>Return Date</label>
<input type="date" id="returnDate" required>

<label>Number of Travelers</label>

<select id="travellers" required>

<option value="">-- Select Number of Travelers --</option>

<option value="1">1 Person</option>

<option value="2">2 Persons</option>

<option value="3">3 Persons</option>

<option value="4">4 Persons</option>

<option value="5">5 Persons</option>

<option value="6">6 Persons</option>

<option value="7">7 Persons</option>

<option value="8">8 Persons</option>

<option value="9">9 Persons</option>

<option value="10">10 Persons</option>

</select>
<label>Travel Mode</label>

<select id="mode" required>

<option value="">Select</option>

<option>Bus</option>

<option>Train</option>

<option>Flight</option>

<option>Car</option>

</select>

<label>Budget (₹)</label>

<input type="number" id="budget" required>

<label>Accommodation</label>

<select id="accommodation" required>

<option value="">Select</option>

<option>Hotel</option>

<option>Resort</option>

<option>Hostel</option>

<option>Homestay</option>

</select>

<label>Places to Visit</label>

<div class="checkbox-group">

<label><input type="checkbox" value="Beach" class="place"> Beach</label>

<label><input type="checkbox" value="Temple" class="place"> Temple</label>

<label><input type="checkbox" value="Museum" class="place"> Museum</label>

<label><input type="checkbox" value="Shopping" class="place"> Shopping</label>

<label><input type="checkbox" value="Adventure Park" class="place"> Adventure Park</label>

</div>

<label>Special Requirements</label>

<textarea id="requirements" rows="4"></textarea>

<button type="submit">

Generate Itinerary

</button>

</form>

</div>

<script>
    function showImage(){

let destination = document.getElementById("destination").value;

let image = document.getElementById("destinationImage");

if(destination=="Ooty"){
image.src="images/ooty.jpg";
}
else if(destination=="Goa"){
image.src="images/goa.jpg";
}
else if(destination=="Kodaikanal"){
image.src="images/kodaikanal.jpg";
}
else if(destination=="Kerala"){
image.src="images/kerala.jpg";
}
else if(destination=="Kanyakumari"){
image.src="images/kanyakumari.jpg";
}
else if(destination=="Manali"){
image.src="images/manali.jpg";
}
else if(destination=="Munnar"){
image.src="images/munnar.jpg";
}
else if(destination=="Mysore"){
image.src="images/mysore.jpg";
}
else if(destination=="Coorg"){
image.src="images/coorg.jpg";
}
else if(destination=="Pondicherry"){
image.src="images/pondicherry.jpg";
}
else if(destination=="Yercaud"){
image.src="images/yercaud.jpg";
}
else{
image.style.display="none";
return;
}

image.style.display="block";

}
function generateItinerary(event){

event.preventDefault();

let places=[];

document.querySelectorAll(".place:checked").forEach(function(item){

places.push(item.value);

});

localStorage.setItem("name",
document.getElementById("name").value);

localStorage.setItem("email",
document.getElementById("email").value);

localStorage.setItem("mobile",
document.getElementById("mobile").value);

localStorage.setItem("start",
document.getElementById("start").value);

localStorage.setItem("destination",
document.getElementById("destination").value);

localStorage.setItem("departure",
document.getElementById("departure").value);

localStorage.setItem("returnDate",
document.getElementById("returnDate").value);

localStorage.setItem("travellers",
document.getElementById("travellers").value);

localStorage.setItem("mode",
document.getElementById("mode").value);

localStorage.setItem("budget",
document.getElementById("budget").value);

localStorage.setItem("accommodation",
document.getElementById("accommodation").value);

localStorage.setItem("places",
places.join(", "));

localStorage.setItem("requirements",
document.getElementById("requirements").value);

window.location.href="itinerary.html";

}

</script>

</body>
</html>
